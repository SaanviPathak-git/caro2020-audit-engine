[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "caro2020-audit-engine"
version = "1.0.0"
description = "Automated Substantive Audit Testing Engine for CARO 2020 Statutory Audits (ICAI & NFRA Compliant)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Audit Tech Innovations", email = "audit-tech@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "reportlab>=4.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
caro-audit = "caro_engine.cli:main"
